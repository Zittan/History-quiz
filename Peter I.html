  {

  },
  {

        options: ["1700 г.", "1711 г.", "1721 г.", "1722 г."],
        correct: 2
      },
      {

        q: "Кто возглавил Церковь после смерти патриарха Адриана в 1700 г.?",

          "Стефан Яворский",
          "Патриарх Филарет",
          "Протопоп Аввакум",
          "Феофан Прокопович"
        ],

      },
      {

        q: "Какой орган заменил патриаршество?",

        correct: 1
      },
      {
        price: 400,
        q: "Что произошло с Русской церковью в 1721 г.?",
        options: [
          "Церковь получила самостоятельность",
          "Церковь подчинена государству через Синод",
          "Был избран новый патриарх",
          "Монастыри были восстановлены в правах"
        ],

      },
      {
        price: 500,
        q: "Какой приказ управлял имуществом церкви при Петре I?",
        options: [

          "Патриарший приказ",
          "Церковный приказ"
        ],
        correct: 1
      }
    ]
  }

/* ============================================================
   СОСТОЯНИЕ ИГРЫ
   ============================================================ */
const TEAM_COLORS = ["#e74c3c", "#3498db", "#2ecc71", "#9b59b6"];

let teams = [
  { name: "Армия", score: 0 },
  { name: "Флот", score: 0 },
  { name: "Сенат", score: 0 },
  { name: "Синод", score: 0 }
];

let currentTeam = 0;
let activeQuestion = null;
let answered = false;

let used = {};

function initUsed() {
  used = {};
  CATEGORIES.forEach(cat => {
    used[cat.id] = {};
    PRICES.forEach(p => { used[cat.id][p] = false; });
  });
}

initUsed();

/* ============================================================
   РЕНДЕР
   ============================================================ */
const teamsEl = document.getElementById("teams");
const boardEl = document.getElementById("board");
const legendEl = document.getElementById("legend");

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderLegend() {
  legendEl.innerHTML = PRICES.map(p => {
    const d = DIFFICULTY[p];
    return `<span>${p} · ${d.stars} · ${d.label}</span>`;
  }).join("");
}

function renderTeams() {
  teamsEl.innerHTML = teams.map((t, i) => `
    <div class="team-card" data-team="${i}">
      <div class="edit-hint">✎ нажмите, чтобы переименовать</div>
      <input
        class="name"
        data-team="${i}"
        value="${escapeHtml(t.name)}"
        maxlength="24"
        title="Изменить название команды"
      >
      <div class="score ${t.score < 0 ? "negative" : ""}" id="score-${i}">${t.score}</div>
      <div class="delta" id="delta-${i}"></div>
      <div class="turn-tag">${i === currentTeam ? "▸ ход команды" : ""}</div>
    </div>
  `).join("");

  teamsEl.querySelectorAll(".name").forEach(input => {
    const idx = Number(input.dataset.team);
    const save = () => {
      const val = input.value.trim();
      teams[idx].name = val || "Команда " + (idx + 1);
      input.value = teams[idx].name;
    };
    input.addEventListener("change", save);
    input.addEventListener("blur", save);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") input.blur();
    });
  });
}

function renderBoard() {
  boardEl.innerHTML = "";

  const corner = document.createElement("div");
  corner.className = "corner";
  corner.innerHTML = "Категория ↓ /<br>Стоимость →";
  boardEl.appendChild(corner);

  PRICES.forEach(price => {
    const d = DIFFICULTY[price];
    const ph = document.createElement("div");
    ph.className = "price-head";
    ph.innerHTML = `
      <span class="ph-num">${price}</span>
      <span class="ph-stars">${d.stars}</span>
      <span class="ph-label">${d.label}</span>
    `;
    boardEl.appendChild(ph);
  });

  CATEGORIES.forEach(cat => {
    const label = document.createElement("div");
    label.className = "cat-label";
    label.textContent = cat.name;
    boardEl.appendChild(label);

    PRICES.forEach(price => {
      const q = cat.questions.find(x => x.price === price);
      const isUsed = used[cat.id][price];
      const cell = document.createElement("button");
      cell.className = "cell" + (isUsed ? " used" : "");
      cell.disabled = isUsed;

      if (!q) {
        cell.textContent = "—";
        cell.disabled = true;
      } else {
        cell.innerHTML = `<span class="cell-price">${price}</span><span class="cell-sub">баллов</span>`;
        cell.title = `${cat.name} — ${price} баллов (${DIFFICULTY[price].label})`;
        cell.addEventListener("click", () => openQuestion(cat.id, price));
      }
      boardEl.appendChild(cell);
    });
  });
}

/* ============================================================
   ОТКРЫТИЕ ВОПРОСА
   ============================================================ */
function openQuestion(catId, price) {
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return;
  if (used[cat.id][price]) return;

  const question = cat.questions.find(x => x.price === price);
  if (!question) return;

  activeQuestion = { category: cat, question, price, team: currentTeam };
  answered = false;

  const d = DIFFICULTY[price];

  const body = document.getElementById("modalBody");
  body.innerHTML = `
    <div class="meta">
      <span>Вопрос за <b>${price}</b> баллов</span>
      <span class="badge team${activeQuestion.team}">Отвечает: ${escapeHtml(teams[activeQuestion.team].name)}</span>
    </div>
    <div class="cat-tag">📚 ${escapeHtml(cat.name)}</div>
    <div class="diff-tag">Сложность: ${d.stars} (${d.label})</div>
    <h2>${escapeHtml(question.q)}</h2>
    <div class="answers" id="mAnswers"></div>
    <div class="result-line" id="mResult"></div>
    <div class="modal-actions">
      <button class="btn" id="mClose" disabled>Далее →</button>
    </div>
  `;

  const answersEl = document.getElementById("mAnswers");
  question.options.forEach((opt, idx) => {
    const b = document.createElement("button");
    b.className = "answer-btn";
    b.textContent = opt;
    b.addEventListener("click", () => selectAnswer(idx));
    answersEl.appendChild(b);
  });

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("overlay").classList.add("show");
}

/* ============================================================
   ОТВЕТ
   ============================================================ */
function selectAnswer(idx) {
  if (answered || !activeQuestion) return;
  answered = true;

  const { category, question, price, team } = activeQuestion;

  used[category.id][price] = true;

  const buttons = document.querySelectorAll("#mAnswers .answer-btn");
  const resultEl = document.getElementById("mResult");

  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === question.correct) b.classList.add("correct");
    else if (i === idx) b.classList.add("wrong");
  });

  const isCorrect = idx === question.correct;

  if (isCorrect) {
    teams[team].score += price;
    resultEl.textContent = `✅ Верно! +${price} баллов команде «${teams[team].name}»`;
    resultEl.className = "result-line ok";
    showDelta(team, "+" + price, true);
  } else {
    teams[team].score -= price;
    resultEl.textContent = `❌ Неверно. −${price} баллов команде «${teams[team].name}». Правильный ответ: «${question.options[question.correct]}»`;
    resultEl.className = "result-line bad";
    showDelta(team, "−" + price, false);
  }

  renderTeams();

  const scoreEl = document.getElementById("score-" + team);
  if (scoreEl) {
    scoreEl.classList.add(isCorrect ? "flash-up" : "flash-down");
    setTimeout(() => scoreEl.classList.remove("flash-up", "flash-down"), 650);
  }

  renderBoard();

  const closeBtn = document.getElementById("mClose");
  closeBtn.disabled = false;
  if (countRemaining() === 0) closeBtn.textContent = "🏁 Итоги";
}

function showDelta(teamIdx, text, isPositive) {
  const el = document.getElementById("delta-" + teamIdx);
  if (el) {
    el.textContent = text;
    el.className = "delta " + (isPositive ? "delta-up" : "delta-down");
    setTimeout(() => {
      if (el) { el.textContent = ""; el.className = "delta"; }
    }, 1800);
  }
}

function countRemaining() {
  let n = 0;
  CATEGORIES.forEach(cat => {
    PRICES.forEach(p => { if (!used[cat.id][p]) n++; });
  });
  return n;
}

/* ============================================================
   ЗАКРЫТИЕ / ПЕРЕХОД ХОДА
   ============================================================ */
function closeModal() {
  document.getElementById("overlay").classList.remove("show");
  activeQuestion = null;

  currentTeam = (currentTeam + 1) % teams.length;
  renderTeams();

  if (countRemaining() === 0) showFinal();
}

/* ============================================================
   ИТОГИ
   ============================================================ */
function showFinal() {
  const ranking = teams
    .map((t, i) => ({ name: t.name, score: t.score, idx: i }))
    .sort((a, b) => b.score - a.score);

  const medal = ["🥇", "🥈", "🥉", "4️⃣"];

  const body = document.getElementById("modalBody");
  body.innerHTML = `
    <div class="final">
      <h2>🏆 Итоги викторины</h2>
      <div class="final-list">
        ${ranking.map((r, place) => `
          <div class="final-row" style="border-color:${TEAM_COLORS[r.idx]};background:rgba(0,0,0,.25)">
            <span class="rank">${medal[place] || (place + 1)}</span>
            <span class="fname" style="color:${TEAM_COLORS[r.idx]}">${escapeHtml(r.name)}</span>
            <span class="fscore ${r.score < 0 ? "negative" : ""}">${r.score} баллов</span>
          </div>
        `).join("")}
      </div>
      <div class="modal-actions" style="justify-content:center">
        <button class="btn" id="finalReset">↺ Новая игра</button>
      </div>
    </div>
  `;

  document.getElementById("overlay").classList.add("show");
  document.getElementById("finalReset").addEventListener("click", () => {
    document.getElementById("overlay").classList.remove("show");
    resetGame();
  });
}

/* ============================================================
   СБРОС
   ============================================================ */
function resetGame() {
  teams = [
    { name: "Армия", score: 0 },
    { name: "Флот", score: 0 },
    { name: "Сенат", score: 0 },
    { name: "Синод", score: 0 }
  ];
  currentTeam = 0;
  activeQuestion = null;
  answered = false;
  initUsed();
  renderTeams();
  renderBoard();
}

/* ============================================================
   ЗАПУСК
   ============================================================ */
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Начать игру заново? Текущие очки и названия команд сбросятся.")) {
    document.getElementById("overlay").classList.remove("show");
    resetGame();
  }
});

document.getElementById("finishBtn").addEventListener("click", () => {
  const total = teams.reduce((a, t) => a + Math.abs(t.score), 0);
  if (total === 0) {
    alert("Сначала ответьте хотя бы на один вопрос!");
    return;
  }
  showFinal();
});

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay" && answered && !document.querySelector(".final")) {
    closeModal();
  }
});

renderLegend();
renderTeams();
renderBoard();
</script>
</body>
